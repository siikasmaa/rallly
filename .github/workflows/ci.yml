name: CI
on: pull_request

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check linting rules
        run: bun run lint

      - name: Check types
        run: bun run lint:tsc

  integration-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/db" >> $GITHUB_ENV
          echo "SECRET_PASSWORD=abcdefghijklmnopqrstuvwxyz1234567890" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run db
        run: |
          docker pull postgres:14.2
          docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=password -e POSTGRES_DB=db postgres:14.2
          bunx wait-on --timeout 60000 tcp:localhost:5432

      - name: Build
        run: bun run build

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Install playwright dependencies
        run: bunx playwright install --with-deps chromium

      - name: Launch app
        run: bun run start 2>&1 &

      - name: Run tests
        run: bun run test

      - name: Upload artifact playwright-report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report
