# Rallly - Cloudflare Workers & Pages Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "rallly"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "rallly-db"
database_id = "" # Set after creating: wrangler d1 create rallly-db

# Environment variables (non-secret)
[vars]
PUBLIC_BASE_URL = "http://localhost:3000"
SUPPORT_EMAIL = ""

# Secrets (set via: wrangler secret put <NAME>)
# SECRET_PASSWORD - Session encryption key (min 32 chars)
# SMTP_HOST - Mail server host
# SMTP_PORT - Mail server port
# SMTP_SECURE - TLS flag
# SMTP_USER - Mail server user
# SMTP_PWD - Mail server password
# SENTRY_DSN - Sentry error tracking DSN
# API_SECRET - House-keeping endpoint auth

# Cron triggers for house-keeping
[triggers]
crons = ["0 6 * * *"] # Daily at 6:00 AM UTC

# Development settings
[dev]
port = 3000

# Production environment overrides
[env.production]
name = "rallly-production"

[env.production.vars]
PUBLIC_BASE_URL = "" # Set to production URL
