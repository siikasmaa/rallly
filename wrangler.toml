# Rallly - Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "rallly"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "rallly-db"
database_id = "91036797-2e69-486e-8a51-3efdef469915"

# Environment variables (non-secret)
[vars]
PUBLIC_BASE_URL = "https://rallly.pages.dev"
SUPPORT_EMAIL = ""
NODE_ENV = "production"

# Secrets (set via: wrangler pages secret put <NAME> --project-name rallly)
# SECRET_PASSWORD - Session encryption key (min 32 chars)
# API_SECRET - House-keeping endpoint auth

# Development settings
[dev]
port = 4321
